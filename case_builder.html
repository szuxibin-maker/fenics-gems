<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GEMS Case Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--surface-2:#F1F3F6;--ink:#111826;--ink-2:#374151;--muted:#667085;--line:#E4E7EC;--line-2:#D0D5DD;
  --accent:#3355E0;--accent-ink:#FFFFFF;--accent-soft:#EDF1FF;
  --m-chem:#0E9384;--m-tran:#2F6FEB;--m-coup:#7A5AF8;--m-out:#DC6803;
  --fail:#D92D20;--fail-soft:#FEF3F2;--ok:#079455;
  --code-bg:#0E131A;--code-ink:#D6DEE8;--code-key:#8AB4FF;--code-str:#9FE3C8;--code-com:#6B7788;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0B0F14;--surface:#12171F;--surface-2:#19202A;--ink:#E8ECF1;--ink-2:#C4CBD5;--muted:#8A94A3;--line:#232B36;--line-2:#303A47;
  --accent:#7390FF;--accent-ink:#0B0F14;--accent-soft:#1A2240;
  --m-chem:#2ED3B7;--m-tran:#60A5FA;--m-coup:#A48AFB;--m-out:#FDB022;
  --fail:#F97066;--fail-soft:#351915;--ok:#47CD89;--code-bg:#080B10;--shadow:none;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0B0F14;--surface:#12171F;--surface-2:#19202A;--ink:#E8ECF1;--ink-2:#C4CBD5;--muted:#8A94A3;--line:#232B36;--line-2:#303A47;
  --accent:#7390FF;--accent-ink:#0B0F14;--accent-soft:#1A2240;
  --m-chem:#2ED3B7;--m-tran:#60A5FA;--m-coup:#A48AFB;--m-out:#FDB022;
  --fail:#F97066;--fail-soft:#351915;--ok:#47CD89;--code-bg:#080B10;--shadow:none;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);margin:0;-webkit-font-smoothing:antialiased}
code,.mono{font-family:var(--mono);font-size:.94em}
.muted{color:var(--muted)}
button,.btn{white-space:nowrap;font:inherit;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;line-height:1.3;box-shadow:var(--shadow);transition:background .12s,border-color .12s}
button:hover,.btn:hover{background:var(--surface-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.small{font-size:12px;padding:4px 10px;border-radius:7px}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .in{max-width:1480px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 12px var(--mono);flex:none}
.brand h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.brand .sub{font:12px var(--mono);color:var(--muted)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.page{max-width:1480px;margin:0 auto;padding-inline:20px;padding-block:20px 60px;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,480px);gap:24px;align-items:start}
@media(max-width:1180px){.page{grid-template-columns:minmax(0,1fr) minmax(0,420px)}}
@media(max-width:900px){.page{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.page,.topbar .in{padding-inline:16px}}

/* ---------- side nav ---------- */
nav.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
nav.side .cap{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 10px 8px}
.navi{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:none;background:none;box-shadow:none;text-align:left;width:100%;font-weight:400}
.navi:hover{background:var(--surface)}
.navi .dot{width:8px;height:8px;border-radius:50%;background:var(--mc)}
.navi .t{display:flex;flex-direction:column;line-height:1.25}
.navi .t b{font-weight:500;font-size:13.5px}
.navi .t span{font:11.5px var(--mono);color:var(--muted)}
.badge{font:600 11px var(--mono);min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;background:var(--fail);color:#fff}
.badge.ok{background:none;color:var(--ok);font-size:13px}
@media(max-width:1180px){nav.side{display:none}}
nav.side .foot{display:flex;gap:4px;padding:10px 4px 0;border-top:1px solid var(--line);margin-top:10px}

/* ---------- modules (accordion) ---------- */
.form{display:flex;flex-direction:column;gap:14px;min-width:0}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);scroll-margin-top:76px;overflow:hidden}
.modhd{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center;width:100%;padding:16px 18px}
.modhd:hover{background:var(--surface-2)}
.modhd:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.modhd .num{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:600 13px var(--mono);color:var(--mc);background:color-mix(in srgb,var(--mc) 12%,transparent);border:1px solid color-mix(in srgb,var(--mc) 30%,transparent)}
.modhd .ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.modhd .ttl .l1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.modhd h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.modhd .file{font:12px var(--mono);color:var(--muted)}
.modhd .sum{font:12.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modhd .chev{width:18px;height:18px;color:var(--muted);transition:transform .18s}
.mod[data-open="true"] .chev{transform:rotate(180deg)}
.mod[data-open="true"] .modhd{border-bottom:1px solid var(--line)}
.pilltag{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.modbody{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;padding:18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row.off{opacity:.5}
@media(max-width:700px){.row{grid-template-columns:minmax(0,1fr);gap:10px}}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.fl{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--mc)}
.fl.sh{border-left-color:var(--line-2)}
.fl b{font-size:13px;font-weight:600}
.fl span{font-size:12px;color:var(--muted)}
.rowhd h3 .u{font:500 11px var(--mono);color:var(--muted);margin-left:4px;padding:1px 6px;border:1px solid var(--line);border-radius:5px}
.rowhd h3{font-size:13.5px;font-weight:600;margin:0 0 3px}
.rowhd p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.rowhd .pilltag{display:inline-block;margin-top:8px}
.rowbody{display:flex;flex-direction:column;gap:12px;min-width:0}

/* ---------- fields ---------- */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 16px}
.field.wide{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.ctl{display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);overflow:hidden;transition:border-color .12s,box-shadow .12s}
.ctl:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.ctl input,.ctl select{flex:1;min-width:0;border:none;outline:none;background:none;color:var(--ink);font:inherit;font-size:13.5px;padding:8px 10px}
.ctl input.num{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.ctl select.unitsel{flex:none;width:auto;min-width:72px;font:12.5px var(--mono);color:var(--ink-2);background-color:var(--surface-2);border-left:1px solid var(--line);padding:0 26px 0 10px}
.ctl .suf{display:flex;align-items:center;padding:0 10px;font:12px var(--mono);color:var(--muted);background:var(--surface-2);border-left:1px solid var(--line)}
.ctl.bad{border-color:var(--fail);background:var(--fail-soft)}
.ctl select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.ctl select option{background:var(--surface);color:var(--ink)}
.readout{font:12px var(--mono);color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:var(--fail)}
.err:empty{display:none}
input[type=text].plain{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
input[type=text].plain:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}

.toggle{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle .trk{flex:none;width:34px;height:20px;border-radius:10px;background:var(--line-2);position:relative;transition:background .15s;margin-top:1px}
.toggle .trk::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked+.trk{background:var(--accent)}
.toggle input:checked+.trk::after{transform:translateX(14px)}
.toggle input:focus-visible+.trk{outline:2px solid var(--accent);outline-offset:2px}
.toggle .tx{display:flex;flex-direction:column;gap:1px}
.toggle .tx b{font-weight:500;font-size:13.5px}
.toggle .tx span{font:12px var(--mono);color:var(--muted)}

.seg{display:inline-flex;align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;box-shadow:none;background:none;border-radius:6px;padding:6px 14px;color:var(--muted)}
.seg button:hover{color:var(--ink);background:none}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.modecard{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.modecard:hover{border-color:var(--muted)}
.modecard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modecard b{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.modecard b::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-2);box-sizing:border-box;flex:none}
.modecard span{font-size:12.5px;color:var(--muted)}
.modecard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.modecard[aria-pressed="true"] b::before{border:4px solid var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12.5px var(--mono);padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--ink-2);box-shadow:none;font-weight:400}
.chip:hover{border-color:var(--muted);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .x{margin-left:6px;opacity:.6}
.chip.warn{border-style:dashed}
.inrow{display:flex;gap:8px;align-items:center;max-width:380px}

.tbl{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tblsc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;font-size:12px;color:var(--muted);background:var(--surface-2);white-space:nowrap}
th .u{font:11px var(--mono);font-weight:400}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
td .cell{width:100%;min-width:90px;font:13px var(--mono);padding:6px 8px;border:1px solid transparent;border-radius:6px;background:none;color:var(--ink);text-align:right}
td .cell.l{text-align:left;font-family:var(--sans)}
td .cell:hover{border-color:var(--line)}
td .cell:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
td.el{font:600 13px var(--mono);width:70px}
.linkbtn{all:unset;cursor:pointer;color:var(--muted);font-size:12px;padding:4px 6px;border-radius:5px}
.linkbtn:hover{color:var(--fail);background:var(--fail-soft)}
.linkbtn:focus-visible{outline:2px solid var(--accent)}

.bcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.bcard{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.bcard h4{margin:0;font-size:13px;font-weight:600}
.bcard .seg{background:var(--surface)}
.bcard .seg button[aria-pressed="true"]{background:var(--surface-2)}
.srcbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.srcbar .ok{color:var(--ok);font-weight:600}
.srcbar select{font:inherit;font-size:12.5px;padding:4px 8px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.quick .hint{margin-right:2px}

/* ---------- YAML panel ---------- */
aside.preview{position:sticky;top:76px;display:flex;flex-direction:column;gap:10px;min-width:0}
@media(max-width:900px){aside.preview{position:static}}
.pv{background:var(--code-bg);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(16,24,40,.12)}
.pvhd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid rgba(255,255,255,.07);flex-wrap:wrap}
.pvhd .fn{font:500 12.5px var(--mono);color:#E6EDF5;display:flex;align-items:center;gap:8px}
.pvhd .fn i{width:8px;height:8px;border-radius:50%;background:#47CD89}
.pvhd .fn i.bad{background:#F97066}
.pvhd .tb button{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#E6EDF5;box-shadow:none}
.pvhd .tb button:hover{background:rgba(255,255,255,.12)}
.pvhd .tb button.primary{background:#E6EDF5;color:#0E131A;border-color:#E6EDF5}
pre.yaml{margin:0;color:var(--code-ink);padding:14px 16px;font:12.5px/1.6 var(--mono);overflow:auto;max-height:calc(100vh - 190px);white-space:pre;counter-reset:ln}
pre.yaml .k{color:var(--code-key)} pre.yaml .c{color:var(--code-com)} pre.yaml .v{color:var(--code-str)}
.status{font-size:12.5px;display:flex;gap:8px;align-items:center}
.issues{display:flex;flex-direction:column;gap:6px;font-size:12.5px;background:var(--fail-soft);color:var(--fail);border:1px solid color-mix(in srgb,var(--fail) 25%,transparent);border-radius:10px;padding:10px 12px}
.issues button{all:unset;cursor:pointer;text-align:left}
.issues button:hover{text-decoration:underline}
.issues button:focus-visible{outline:2px solid var(--fail)}
.toast{font-size:12.5px;color:var(--ok);min-height:1em}
datalist{display:none}
</style>

</head><body>
<header class="topbar"><div class="in">
  <div class="brand"><span class="mark">yml</span><div><h1>GEMS Case Builder</h1><div class="sub">FEniCSx × GEMS · case.yaml</div></div></div>
  <div class="tb">
    <label class="btn" for="importIn">Import case.yaml</label>
    <input type="file" id="importIn" accept=".yaml,.yml" hidden>
    <button class="btn ghost" id="resetBtn">Reset to example</button>
  </div>
</div></header>

<div class="page">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <div class="form" id="form"></div>
  <aside class="preview">
    <div class="pv">
      <div class="pvhd"><span class="fn"><i id="dot"></i>case.yaml</span>
        <div class="tb"><button class="btn small" id="copyBtn">Copy</button><button class="btn small primary" id="dlBtn">Download</button></div></div>
      <pre class="yaml" id="yaml"></pre>
    </div>
    <span class="status" id="status"></span>
    <div class="issues" id="issues" hidden></div>
    <span class="toast" id="toast" aria-live="polite"></span>
  </aside>
</div>

<script>

const clone = o => JSON.parse(JSON.stringify(o));
let C = clone(EXAMPLE);
const G = { dch: DCH0?.dch || null, dchName: DCH0?.name || '', lsts: [], pool: [] };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- path helpers ---------- */
function get(p){ return p.split('.').reduce((o,k)=>o==null?undefined:o[k], C); }
function set(p,v){ const ks=p.split('.'); let o=C; ks.slice(0,-1).forEach(k=>{ if(o[k]==null||typeof o[k]!=='object') o[k]={}; o=o[k]; }); o[ks[ks.length-1]]=v; }
function del(p){ const ks=p.split('.'); const o=ks.slice(0,-1).reduce((o,k)=>o?.[k],C); if(o) delete o[ks[ks.length-1]]; }

/* ---------- DCH-derived names ---------- */
function names(){
  const d=G.dch; if(!d) return null;
  const IC=arr(d.ICNL), PH=arr(d.PHNL), ccPH=arr(d.ccPH), DC=arr(d.DCNL), G0=arr(d.G0);
  const st=G0.length/Math.max(DC.length,1);
  return { el:IC.filter(n=>n!=='Zz'), ph:PH.map((n,i)=>({n,cc:ccPH[i]})), sp:DC, g0:Object.fromEntries(DC.map((n,j)=>[n,G0[j*st]])) };
}

/* ---------- number formatting ---------- */
function showNum(v){ if(typeof v!=='number') return v??''; if(!isFinite(v)) return String(v); const a=Math.abs(v); return (a!==0&&(a<1e-4||a>=1e10))? v.toExponential().replace('e+','e+') : String(v); }
function yNum(v, isInt){
  if(typeof v!=='number'||!isFinite(v)) return String(v);
  if(isInt) return String(Math.trunc(v));
  let s=String(v);
  if(/e/i.test(s)){ let [m,e]=s.split(/e/i); if(!m.includes('.')) m+='.0'; if(!/^[+-]/.test(e)) e='+'+e; return m+'e'+e; }
  return s;
}
function yFloat(v){ const s=yNum(v); return (typeof v==='number'&&Number.isInteger(v)&&!/e/.test(s))? s+'.0' : s; }
const RESERVED=/^(y|Y|yes|Yes|YES|n|N|no|No|NO|true|True|TRUE|false|False|FALSE|on|On|ON|off|Off|OFF|null|Null|NULL|~)$/;
function yStr(s){ s=String(s); if(s===''||RESERVED.test(s)||/^[-+]?[\d.]/.test(s)||!/^[A-Za-z_][A-Za-z0-9_+\-()@.\/]*$/.test(s)) return `'${s.replace(/'/g,"''")}'`; return s; }

function flowMap(o,num=yFloat){ const e=Object.entries(o||{}); return e.length? '{'+e.map(([k,v])=>`${yStr(k)}: ${num(v)}`).join(', ')+'}' : '{}'; }
function flowSeq(a){ return '['+arr(a).map(yStr).join(', ')+']'; }

/* ---------- YAML output ---------- */
function toYaml(){
  const L=[]; const w=(s,c)=>L.push(c? (s.padEnd(38)+' # '+c) : s);
  const ch=C.chemistry, tr=C.transport, cp=C.coupling, out=C.output;
  w('# One input file, four sections matching the four Python files.');
  w('# Run in the WSL fenicsx environment: python coupling.py case.yaml');
  w('');
  w('# 1. chemistry.py: GEMS project, chemical conditions, and recipes.');
  w('chemistry:');
  w(`  project: ${yPath(ch.project)}`);
  w(`  temperature: ${yNum(ch.temperature)}`,'K');
  w(`  pressure: ${yNum(ch.pressure)}`,'Pa');
  w(`  aqueous_phase: ${yStr(ch.aqueous_phase)}`);
  w(`  solid_phases: ${flowSeq(ch.solid_phases)}`);
  w('');
  w('  # Gibbs energy adjustments (J/mol), applied in memory.');
  w(`  gibbs: ${flowMap(ch.gibbs)}`);
  w('');
  for(const [k,c] of [['initial','Sample: element amounts in mol per 1 dm3 of BULK sample (pore water + solids).'],['inlet','Boundary solution: element amounts in mol per recipe; its equilibrated aqueous part sets the Dirichlet concentration.']]){
    w('  # '+c);
    const e=Object.entries(ch[k]||{});
    if(!e.length) w(`  ${k}: {}`); else { w(`  ${k}:`); e.forEach(([n,v])=>w(`    ${yStr(n)}: ${yNum(v)}`)); }
    w('');
  }
  w('# 2. transport.py: geometry, material, boundary conditions, and linear solver.');
  w('transport:');
  w('  geometry:');
  w(`    length: ${yNum(tr.geometry.length)}`,'m; uniform 1D mesh');
  w(`    cells: ${yNum(tr.geometry.cells,true)}`);
  w('');
  w('  material:');
  w(`    phi: ${yNum(tr.material.phi)}`,'initial porosity');
  w(`    De: ${yNum(tr.material.De)}`,'initial effective diffusivity, m2/s');
  w('');
  w('  # Tracer settings are used only when coupling.mode is diffusion.');
  w(`  components: ${flowSeq(tr.components)}`);
  w(`  initial: ${flowMap(tr.initial)}`,'mol/m3 pore water');
  w('');
  w('  boundary:');
  for(const side of ['left','right']){
    const b=tr.boundary[side];
    w(`    ${side}:`);
    w(`      type: ${b.type}`);
    w(`      concentrations: ${flowMap(b.concentrations)}`, b.type==='dirichlet'?'diffusion mode only; mol/m3 pore water':'used only if changed to dirichlet');
  }
  w('  # In coupled mode, every Dirichlet boundary uses chemistry.inlet.');
  w('');
  w('  solver:');
  w(`    ksp_type: ${yStr(tr.solver.ksp_type)}`);
  w(`    pc_type: ${yStr(tr.solver.pc_type)}`);
  w(`    rtol: ${yNum(tr.solver.rtol)}`);
  w(`    max_iterations: ${yNum(tr.solver.max_iterations,true)}`);
  w('');
  w('# 3. coupling.py: calculation mode, time loop, and reaction feedback.');
  w('coupling:');
  w(`  mode: ${cp.mode}`,'diffusion, chemistry, or coupled');
  w('  time:');
  w(`    dt: ${yNum(cp.time.dt)}`,'s; '+dayNote(cp.time.dt));
  w(`    end: ${yNum(cp.time.end)}`,'s; '+dayNote(cp.time.end));
  w(`  update_porosity: ${cp.update_porosity?'true':'false'}`);
  w(`  update_diffusivity: ${cp.update_diffusivity?'true':'false'}`);
  w(`  exponent: ${yFloat(cp.exponent)}`,'De = De0 * (phi/phi0)^exponent');
  w('');
  w('# 4. output.py: result location and profile-saving interval.');
  w('output:');
  w(`  folder: ${yPath(out.folder)}`);
  w(`  every: ${yNum(out.every,true)}`,'save profiles every N steps; balances every step');

function dayNote(s){ if(typeof s!=='number'||!isFinite(s)||s<=0) return ''; const d=Number((s/86400).toPrecision(6)); return d>=36.525? `${d} d = ${Number((s/YR).toPrecision(4))} yr` : `${d} d`; }
function human(s){
  if(typeof s!=='number'||!isFinite(s)||s<=0) return '';
  const fmt=v=>Number(v.toPrecision(4)).toString();
  if(s>=0.1*YR) return fmt(s/YR)+' year'+(s/YR===1?'':'s');
  if(s>=86400) return fmt(s/86400)+' d';
  if(s>=3600) return fmt(s/3600)+' h';
  if(s>=60) return fmt(s/60)+' min';
  return fmt(s)+' s';
}
function highlight(y){
  return y.split('\n').map(l=>{
    const m=l.match(/^(\s*)([^#\s][^:#]*?):(\s|$)(.*)$/);
    let body, com='';
    const ci=l.indexOf(' # '); const lineC=/^\s*#/.test(l);
    if(lineC) return `<span class="c">${esc(l)}</span>`;
    let main=l; if(ci>=0){ main=l.slice(0,ci); com=l.slice(ci); }
    const mm=main.match(/^(\s*)([^:]+?):(.*)$/);
    body = mm? `${mm[1]}<span class="k">${esc(mm[2])}</span>:${esc(mm[3])}` : esc(main);
    return body+(com?`<span class="c">${esc(com)}</span>`:'');
  }).join('\n');
}

/* ---------- validation (mirrors coupling.read_case and the module checks) ---------- */
function validate(){
  const E={}; const e=(p,m)=>{ if(!E[p]) E[p]=m; };
  const ch=C.chemistry, tr=C.transport, cp=C.coupling, out=C.output, mode=cp.mode;
  const pos=(p,v)=>{ if(typeof v!=='number'||!isFinite(v)||v<=0) e(p,'Enter a positive number.'); };
  const posInt=(p,v)=>{ if(typeof v!=='number'||!Number.isInteger(v)||v<1) e(p,'Enter a positive whole number.'); };
  const nonneg=(p,v)=>{ if(typeof v!=='number'||!isFinite(v)||v<0) e(p,'Enter a number ≥ 0.'); };
  const N=names();
  if(mode!=='diffusion'){
    if(!String(ch.project||'').trim()) e('chemistry.project','Enter the path to the GEMS *.lst file, relative to case.yaml.');
    pos('chemistry.temperature',ch.temperature); pos('chemistry.pressure',ch.pressure);
    if(!String(ch.aqueous_phase||'').trim()) e('chemistry.aqueous_phase','Choose the aqueous phase.');
    else if(N && !N.ph.some(p=>p.n===ch.aqueous_phase)) e('chemistry.aqueous_phase',`“${ch.aqueous_phase}” is not a phase in the loaded GEMS system.`);
    const badPh=arr(ch.solid_phases).filter(n=>N && !N.ph.some(p=>p.n===n));
    if(badPh.length) e('chemistry.solid_phases',`Not in the loaded GEMS system: ${badPh.join(', ')}.`);
    if(!arr(ch.solid_phases).length) e('chemistry.solid_phases','Select at least one solid phase.');
    Object.entries(ch.gibbs||{}).forEach(([k,v],i)=>{ if(!k) e('chemistry.gibbs','Every G0 override needs a species name.'); else if(N&&!N.sp.includes(k)) e('chemistry.gibbs',`“${k}” is not a species in the loaded GEMS system.`); if(typeof v!=='number'||!isFinite(v)) e('chemistry.gibbs',`Enter a number for ${k||'the override'}.`); });
    for(const r of ['initial','inlet']){
      const o=ch[r]||{}; if(!Object.keys(o).length) e('chemistry.'+r,'Enter at least one element amount.');
      Object.entries(o).forEach(([k,v])=>{ if(typeof v!=='number'||!isFinite(v)||v<0) e('chemistry.'+r,`${k}: enter a number ≥ 0.`); if(N&&!N.el.includes(k)&&k!=='Zz') e('chemistry.'+r,`“${k}” is not an element in the loaded GEMS system.`); });
    }
  }
  pos('transport.geometry.length',tr.geometry.length);
  if(mode!=='chemistry') posInt('transport.geometry.cells',tr.geometry.cells);
  pos('transport.material.phi',tr.material.phi); if(tr.material.phi>1) e('transport.material.phi','Porosity must be ≤ 1.');
  pos('transport.material.De',tr.material.De);
  if(mode==='diffusion'){
    const c=arr(tr.components);
    if(!c.length) e('transport.components','Add at least one tracer.');
    if(new Set(c).size!==c.length) e('transport.components','Tracer names must be unique.');
    if(c.includes('Zz')) e('transport.components','Zz is reserved for charge.');
    c.forEach(n=>nonneg('transport.initial',tr.initial?.[n]));
    for(const side of ['left','right']) if(tr.boundary[side].type==='dirichlet') c.forEach(n=>nonneg(`transport.boundary.${side}`,tr.boundary[side].concentrations?.[n]));
  }
  if(mode!=='chemistry'){ pos('transport.solver.rtol',tr.solver.rtol); posInt('transport.solver.max_iterations',tr.solver.max_iterations);
    if(!String(tr.solver.ksp_type||'').trim()) e('transport.solver.ksp_type','Enter a PETSc KSP type.');
    if(!String(tr.solver.pc_type||'').trim()) e('transport.solver.pc_type','Enter a PETSc PC type.'); }
  pos('coupling.time.dt',cp.time.dt); pos('coupling.time.end',cp.time.end);
  pos('coupling.exponent',cp.exponent);
  if(cp.update_diffusivity && !cp.update_porosity) e('coupling.update_diffusivity','Diffusivity feedback needs porosity feedback switched on.');
  if(mode==='diffusion' && cp.update_porosity) e('coupling.update_porosity','Porosity feedback needs chemistry; switch it off in diffusion mode.');
  if(!String(out.folder||'').trim()) e('output.folder','Enter a result folder.');
  posInt('output.every',out.every);
  return E;
}

  const ch=C.chemistry, tr=C.transport;
  if(t.dataset.solid){ const n=t.dataset.solid; const s=arr(ch.solid_phases); ch.solid_phases= s.includes(n)? s.filter(x=>x!==n) : orderPhases([...s,n]); renderForm(); return; }
  if(t.id==='addSolidBtn'){ const v=document.getElementById('addSolid').value.trim(); if(v&&!arr(ch.solid_phases).includes(v)) ch.solid_phases=[...arr(ch.solid_phases),v]; renderForm(); return; }
  if(t.id==='addElBtn'){ const v=document.getElementById('addEl').value.trim(); if(v){ ch.initial=ch.initial||{}; if(!(v in ch.initial)) ch.initial[v]=0; } renderForm(); return; }
  if(t.id==='gibAdd'){ const e2=Object.entries(ch.gibbs||{}); e2.push(['',NaN]); ch.gibbs=Object.fromEntries(e2); renderForm(); document.querySelector(`[data-gibname="${e2.length-1}"]`)?.focus(); return; }
  if(t.dataset.gibdel!==undefined){ const e2=Object.entries(ch.gibbs); e2.splice(+t.dataset.gibdel,1); ch.gibbs=Object.fromEntries(e2); renderForm(); return; }
  if(t.dataset.bc){ tr.boundary[t.dataset.bc].type=t.dataset.v; renderForm(); return; }
  if(t.dataset.mode){ C.coupling.mode=t.dataset.mode; renderForm(); return; }
  if(t.dataset.quick){ C.coupling.time[t.dataset.quick]=Number(t.dataset.v); renderForm(); return; }
  if(t.id==='addCompBtn'){ const v=document.getElementById('addComp').value.trim(); if(v&&!arr(tr.components).includes(v)){ tr.components=[...arr(tr.components),v]; tr.initial={...tr.initial,[v]:0}; for(const s of ['left','right']) tr.boundary[s].concentrations={...tr.boundary[s].concentrations,[v]:0}; } renderForm(); document.getElementById('addComp')?.focus(); return; }
  if(t.dataset.comprm){ const v=t.dataset.comprm; tr.components=arr(tr.components).filter(x=>x!==v); delete tr.initial?.[v]; for(const s of ['left','right']) delete tr.boundary[s].concentrations?.[v]; renderForm(); return; }
  if(t.id==='resetBtn'){ C=clone(EXAMPLE); toast('Reset to the example case.'); renderForm(); return; }
  if(t.id==='copyBtn'){ copy(); return; }
  if(t.id==='dlBtn'){ download(); return; }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const map={addComp:'addCompBtn',addSolid:'addSolidBtn',addEl:'addElBtn'}; const b=map[e.target.id]; if(b){ e.preventDefault(); document.getElementById(b).click(); }
});
function orderPhases(list){ const N=names(); if(!N) return list; const o=N.ph.map(p=>p.n); return [...list].sort((a,b)=>(o.indexOf(a)+1||1e9)-(o.indexOf(b)+1||1e9)); }
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; clearTimeout(toast.t); toast.t=setTimeout(()=>el.textContent='',4000); }
async function copy(){
  try{ await navigator.clipboard.writeText(lastYaml); toast('Copied case.yaml to the clipboard.'); }
  catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById('yaml')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Press Ctrl+C to copy the selected YAML.'); }
}
let DL=null;
if(window.claude?.use){ window.claude.use('downloads').then(d=>{ DL=d; }).catch(()=>{}); }
async function download(){
  if(DL){
    try{ await DL.save({filename:'case.yaml.txt',data:lastYaml}); toast('Saved case.yaml.txt. Rename it to case.yaml (the viewer does not allow .yaml downloads).'); }
    catch(err){ if(err?.code==='declined') toast('Download cancelled.'); else toast('Download is not available here. Use Copy and paste into case.yaml.'); }
    return;
  }
  if(window.claude){ toast('Download is not available here. Use Copy and paste into case.yaml.'); return; }
  const url=URL.createObjectURL(new Blob([lastYaml],{type:'text/yaml'}));
  const a=document.createElement('a'); a.href=url; a.download='case.yaml'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast('Saved case.yaml to your downloads folder.');
}

/* ---------- import ---------- */
function importYaml(text,name){
  if(!window.jsyaml){ toast('The YAML reader needs an internet connection to load.'); return; }
  let y; try{ y=jsyaml.load(text); }catch(err){ toast(`${name}: ${err.message.split('\n')[0]}`); return; }
  const base=clone(EXAMPLE);
  const merge=(a,b)=>{ if(b==null) return a; if(typeof a!=='object'||Array.isArray(a)||a==null) return b; const o={...a}; for(const k in b) o[k]= (k in a && typeof a[k]==='object' && a[k]!==null && !Array.isArray(a[k]) && !['gibbs','initial','inlet','concentrations'].includes(k) && !(k==='initial')) ? merge(a[k],b[k]) : b[k]; return o; };
  C=merge(base,y||{});
  for(const k of ['gibbs','initial','inlet']) if(C.chemistry[k]==null) C.chemistry[k]={};
  toast(`Imported ${name}.`); renderForm();
}

/* ---------- GEMS folder ---------- */
const bname=p=>p.split(/[\\/]/).pop(); const dname=p=>{ const i=p.lastIndexOf('/'); return i<0?'':p.slice(0,i); };
async function readDch(file){
  const txt=await file.text(); const t=txt.trimStart();
  if(t[0]==='['||t[0]==='{'){ let o=JSON.parse(txt); if(Array.isArray(o)) o=o[0]; return o.dch || (o.DCNL?o:null); }
  const o={}; let key=null; const re=/<([A-Za-z0-9_]+)>|'([^']*)'|"([^"]*)"|#[^\n]*|([^\s<'"#]+)/g; let m;
  while((m=re.exec(txt))){ if(m[1]){ key=m[1]; o[key]=o[key]||[]; continue; } if(key===null) continue;
    if(m[2]!==undefined||m[3]!==undefined) o[key].push(m[2]??m[3]); else if(m[4]!==undefined){ const n=Number(m[4]); o[key].push(Number.isNaN(n)?m[4]:n); } }
  return o.DCNL? o : null;
}
async function loadGemsFolder(files){
  G.pool=files.map(f=>({path:f.webkitRelativePath||f.name,file:f}));
  G.lsts=[];
  for(const e of G.pool.filter(e=>/\.lst$/i.test(e.path))){
    const t=await e.file.text(); const nm=[...t.matchAll(/"([^"]+)"|'([^']+)'/g)].map(m=>m[1]||m[2]);
    const dch=nm.find(n=>/dch/i.test(n)); if(dch) G.lsts.push({path:e.path,dch});
  }
  G.lsts.sort((a,b)=>a.path.localeCompare(b.path));
  if(!G.lsts.length){ toast('No *.lst file that names a DCH file was found in that folder.'); return; }
  await useLst(0);
}
async function useLst(i){
  const L=G.lsts[i]; const d=dname(L.path);
  const e=G.pool.find(x=>x.path===(d?d+'/':'')+L.dch)||G.pool.find(x=>bname(x.path)===bname(L.dch));
  if(!e){ toast(`${bname(L.path)} names ${L.dch}, which is not in the folder.`); return; }
  try{ const dch=await readDch(e.file); if(!dch) throw new Error('not a DCH file'); G.dch=dch; G.dchName=e.path; }
  catch(err){ toast(`${bname(e.path)}: ${err.message}`); return; }
  C.chemistry.project=L.path;
  toast(`Using ${L.path}. Project path set to “${L.path}”; adjust it if the folder is not next to case.yaml.`);
  renderForm();
}

renderSide();
renderForm();
