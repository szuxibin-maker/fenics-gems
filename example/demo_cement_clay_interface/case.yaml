# Cement-clay interface (fenics-reaktoro Demos/Cement-Clay_interface),
# with the four modules two folders up (FEniCSx_GEMS_Beginner).
# Run from this folder:  python ../../coupling.py case.yaml   (or Run.cmd, or the notebook)
#
# Original: 0.5 m, 100 cells, clay buffer (GEMSBC-buf) on 0-0.25 m, cement (GEMSport-buf)
# on 0.25-0.5 m, both ends closed, 1e5 s in steps of 1e4 s, species-specific diffusion
# coefficients (flux = phi * D_i * grad c_i). Here: one D = 1e-9 m2/s for all elements.

# 1. chemistry.py: GEMS project, chemical conditions, and recipes.
chemistry:
  project: chemistry_data/GEMSBC-buf-dat.lst   # same DCH as GEMSport-buf
  temperature: 298.15                  # K
  pressure: 100000                     # Pa
  aqueous_phase: aq_gen
  solid_phases: [Gibbsite, Kaolinite, Aragonite, Calcite, Dolomite-dis, Portlandite, Magnesite, Brucite, Quartz]
  gibbs: {}

  # Sample per zone: element amounts in mol per 1 dm3 of BULK sample (pore water + solids).
  # = the GEMS DBR states GEMSBC-buf (clay) and GEMSport-buf (cement), scaled to 1 dm3.
  initial:
    clay:
      Al: 1.5594088526159584
      C: 1.048990140220538
      Ca: 0.7756780218510019
      Cl: 0.08610482212727887
      H: 58.984740226571944
      Mg: 0.2728947648153855
      Na: 0.08610482212727887
      O: 71.59776335421107
      Si: 18.309863447446855
    cement:
      Al: 4.790137255526526e-09
      C: 12.928196158015355
      Ca: 13.011590804181834
      Cl: 0.08855865465716344
      H: 57.62564860796735
      Mg: 2.8067177468074874e-09
      Na: 0.08855865465716344
      O: 67.6808074594352
      Si: 1.2623534359419002e-08

  # No Dirichlet boundary, so no boundary solution is needed.

# 2. transport.py: geometry, material, zones, boundary conditions, and linear solver.
transport:
  geometry:
    length: 0.5                        # m
    cells: 100                         # as the original mesh

  material:                            # defaults; both zones override them
    phi: 0.5
    De: 5.0e-10

  # phi = pore-water volume fraction of each GEMS state; De = phi * D with D = 1e-9 m2/s.
  zones:
    - {name: clay, from: 0.0, to: 0.25, phi: 0.5060963798562873, De: 5.060963798562873e-10}
    - {name: cement, from: 0.25, to: 0.5, phi: 0.5202131437594824, De: 5.202131437594824e-10}

  # Tracer settings are used only when coupling.mode is diffusion.
  components: [tracer]
  initial: {tracer: 0.0}

  boundary:
    left:
      type: no_flux
      concentrations: {tracer: 0.0}
    right:
      type: no_flux
      concentrations: {tracer: 0.0}

  solver:
    ksp_type: preonly
    pc_type: lu
    rtol: 1.0e-10
    max_iterations: 1000

# 3. coupling.py: calculation mode, time loop, and reaction feedback.
coupling:
  mode: coupled
  time:
    dt: 10000                          # s
    end: 100000                        # s
  update_porosity: true                # porosity follows the mineral volumes
  update_diffusivity: true
  exponent: 1.0                        # De = phi * D, so De scales with phi

# 4. output.py: result location and profile-saving interval.
output:
  folder: results
  every: 1                             # every step (10 profiles)
